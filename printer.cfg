[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_xxxxxxxxx-if00
restart_method: command

[printer]
kinematics: delta
max_velocity: 300
max_accel: 3000
max_z_velocity: 200
max_z_accel: 1000

[stepper_a]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 0.0
arm_length: 250.0

[stepper_b]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio7
position_endstop: 0.0
arm_length: 250.0

[stepper_c]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio11
position_endstop: 0.0
arm_length: 250.0

[delta_calibrate]
radius: 100.0

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 7.5
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
min_temp: 0
max_temp: 250
max_extrude_only_distance: 100.0

[fan]
pin: gpio17

[delta_tower_angle_trims]
tower_a_angle: 0
tower_b_angle: 0
tower_c_angle: 0
