[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_xxxxx-if00
restart_method: command

[printer]
kinematics: delta
max_velocity: 200
max_accel: 2000
max_z_velocity: 120
max_z_accel: 1000
min_position: -155,-155,0
max_position: 155,155,420
delta_radius: 270.0
delta_tower_angle_a: 210
delta_tower_angle_b: 330
delta_tower_angle_c: 90

[stepper_a]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 0.0
arm_length: 390.0

[stepper_b]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio7
position_endstop: 0.0
arm_length: 390.0

[stepper_c]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio11
position_endstop: 0.0
arm_length: 390.0

[delta_calibrate]
radius: 270.0

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 7.5
nozzle_diameter: 0.6
filament_diameter: 1.75
heater_pin: gpio15
sensor_type: NTC 100K beta=3950
sensor_pin: gpio26
min_temp: 0
max_temp: 220
max_extrude_only_distance: 100.0
control: pid

[fan]
pin: gpio16

[tmc2226 stepper_a]
uart_pin: gpio17
run_current: 0.9
hold_current: 0.5

[tmc2226 stepper_b]
uart_pin: gpio18
run_current: 0.9
hold_current: 0.5

[tmc2226 stepper_c]
uart_pin: gpio19
run_current: 0.9
hold_current: 0.5

[tmc2226 extruder]
uart_pin: gpio20
run_current: 0.8
hold_current: 0.4

[delta_tower_angle_trims]
tower_a_angle: 0
tower_b_angle: 0
tower_c_angle: 0
